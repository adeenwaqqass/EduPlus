spring.application.name=cms

# Server Configuration
server.port=8080

# Disable default Spring Security auto-configuration for open REST endpoints
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/eduplus_cms
spring.data.mongodb.database=eduplus_cms

# Logging Configuration
logging.level.org.springframework.web=INFO
logging.level.com.Eduplus.cms=DEBUG
